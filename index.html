<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPEAK UP BUDDY</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffe4f1,#e9e2ff);
  min-height:100vh;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  box-sizing:border-box
}

.card{
  background:white;
  max-width:520px;
  width:100%;
  border-radius:28px;
  padding:28px;
  box-shadow:0 12px 35px rgba(0,0,0,.12);
  text-align:center
}

h1{
  color:#d63384;
  margin:0 0 8px
}

.subtitle{
  color:#666;
  margin-bottom:24px
}

.question{
  background:#fff5fa;
  border-radius:18px;
  padding:20px;
  font-size:24px;
  font-weight:700;
  margin-bottom:20px
}

button{
  border:0;
  border-radius:18px;
  padding:16px 24px;
  font-size:18px;
  font-weight:700;
  margin:6px;
  cursor:pointer
}

#start{
  background:#ec4899;
  color:white
}

#stop{
  background:#6366f1;
  color:white
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

#status{
  margin:18px 0;
  font-weight:600;
  min-height:24px
}

audio{
  width:100%;
  margin-top:10px
}

#feedback{
  text-align:left;
  margin-top:20px;
  padding:18px;
  background:#f8f5ff;
  border-radius:18px;
  white-space:pre-wrap;
  display:none
}
</style>
</head>

<body>

<div class="card">

<h1>🎤 SPEAK UP BUDDY</h1>

<div class="subtitle">
SPM English Speaking Coach
</div>

<div id="modeBox">

  <h2>👋 Welcome, Speaker!</h2>

  <p>Choose your practice mode:</p>

  <button id="studentMode">
    👤 STUDENT MODE
  </button>

  <button id="anonymousMode">
    🌸 ANONYMOUS
  </button>

  <div id="nameBox" style="display:none; margin-top:15px;">

    <p><strong>What's your name?</strong></p>

    <input
      id="studentName"
      type="text"
      placeholder="Type your name here"
      style="
        width:90%;
        padding:14px;
        border-radius:15px;
        border:1px solid #ddd;
        font-size:16px;
      "
    >

    <button id="continueBtn">
      CONTINUE →
    </button>

  </div>

</div>


<div id="practiceBox" style="display:none;">

  <div class="question">
    What is your name?
  </div>

  <button id="start">
    🎤 SPEAK NOW
  </button>

  <button id="stop" disabled>
    ⏹️ STOP
  </button>

</div>

<div id="status">
Ready. Press SPEAK NOW.
</div>

<audio id="audio" controls hidden></audio>

<div id="feedback"></div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbwb4lEbAFjJNPEi47lPPanjTIS3Kkqc9eo_Fjb5g3I7FIL7iuj2_C0S9hiSffSwWprZQg/exec";

let recorder;
let chunks = [];
let stream;

const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const status = document.getElementById("status");
const audio = document.getElementById("audio");
const feedback = document.getElementById("feedback");
  // ===============================
// STUDENT / ANONYMOUS MODE
// ===============================

let practiceMode = "";
let studentName = "";

const studentModeBtn = document.getElementById("studentMode");
const anonymousModeBtn = document.getElementById("anonymousMode");
const nameBox = document.getElementById("nameBox");
const studentNameInput = document.getElementById("studentName");
const continueBtn = document.getElementById("continueBtn");
const modeBox = document.getElementById("modeBox");
const practiceBox = document.getElementById("practiceBox");

studentModeBtn.onclick = () => {

  practiceMode = "Student";

  nameBox.style.display = "block";

  studentNameInput.focus();

};

anonymousModeBtn.onclick = () => {

  practiceMode = "Anonymous";
  studentName = "Anonymous";

  modeBox.style.display = "none";
  practiceBox.style.display = "block";

  status.textContent = "Anonymous Mode — Ready. Press SPEAK NOW.";

};

continueBtn.onclick = () => {

  const name = studentNameInput.value.trim();

  if (!name) {

    alert("Please enter your name.");

    studentNameInput.focus();

    return;

  }

  practiceMode = "Student";
  studentName = name;

  localStorage.setItem("studentName", studentName);
  
  modeBox.style.display = "none";
  practiceBox.style.display = "block";

  status.textContent = "Welcome, " + studentName + "! Press SPEAK NOW.";

};

startBtn.onclick = async () => {

  try {

    status.textContent = "🎤 Requesting microphone...";

    stream = await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });

    chunks = [];

    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = event => {
      if(event.data.size > 0){
        chunks.push(event.data);
      }
    };

    recorder.onstop = async () => {

      const blob = new Blob(chunks,{
        type:"audio/webm"
      });

      audio.src = URL.createObjectURL(blob);
      audio.hidden = false;

      stream.getTracks().forEach(track => track.stop());

      status.textContent = "⏳ Sending your speaking to AI...";

      await sendToGemini(blob);
    };

    recorder.start();

    startBtn.disabled = true;
    stopBtn.disabled = false;

    status.textContent =
      "🔴 Recording... Speak now!";

  }

  catch(error){

    status.textContent =
      "⚠️ " + error.name + " — " + error.message;

    console.error(error);

  }

};


stopBtn.onclick = () => {

  if(recorder && recorder.state !== "inactive"){

    recorder.stop();

    startBtn.disabled = false;
    stopBtn.disabled = true;

  }

};


async function sendToGemini(blob){

  try {

    const base64 = await blobToBase64(blob);

    const requestId =
      "REQ_" + Date.now() + "_" +
      Math.random().toString(36).substring(2,8);
const iframe = document.createElement("iframe");

iframe.name = "hiddenFrame";
iframe.style.display = "none";

document.body.appendChild(iframe);

const form = document.createElement("form");

    form.method = "POST";
    form.action = WEB_APP_URL;
    form.target = "hiddenFrame";
    form.style.display = "none";

    const fields = {
      audio: base64,
      mimeType: "audio/webm",
      question: "What is your name?",
      requestId: requestId,
      studentName: studentName,
      mode: practiceMode
    };

    Object.keys(fields).forEach(function(key){

      const input = document.createElement("input");

      input.type = "hidden";
      input.name = key;
      input.value = fields[key];

      form.appendChild(input);

    });

    document.body.appendChild(form);

    form.submit();

    form.remove();

    status.textContent =
      "⏳ AI is analysing your speaking...";

    waitForResult(requestId);

  }

  catch(error){

    console.error(error);

    status.textContent =
      "⚠️ Could not send recording.";

    feedback.style.display = "block";

    feedback.textContent =
      error.message;

  }

}

function formatFeedback(text){

  let output = text;

  output = output
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");

  return `
    <div class="buddy-title">🎤 SPEAK UP BUDDY</div>

    <div class="feedback-content">
      ${output}
    </div>

    <div class="buddy-message">
      💡 <strong>Keep speaking!</strong><br>
      Don't worry about mistakes. Speak more, improve more! 💗
    </div>
  `;
}
function waitForResult(requestId){

  let attempts = 0;
  const maxAttempts = 30;

  function checkResult(){

    attempts++;

    const callbackName =
      "geminiCallback_" + Date.now();

    window[callbackName] = function(data){

      delete window[callbackName];

      // =========================
      // RESULT READY
      // =========================

      if(data && data.success){

  status.textContent =
    "✅ AI analysis complete!";

  feedback.style.display =
    "block";

  const aiText =
    data.result &&
    data.result.candidates &&
    data.result.candidates[0] &&
    data.result.candidates[0].content &&
    data.result.candidates[0].content.parts &&
    data.result.candidates[0].content.parts[0]
      ? data.result.candidates[0].content.parts[0].text
      : "No feedback received.";

  feedback.innerHTML = formatFeedback(aiText);

  script.remove();

  return;
}


      // =========================
      // NOT READY YET
      // TRY AGAIN
      // =========================

      if(
        data &&
        data.error === "Result not ready yet." &&
        attempts < maxAttempts
      ){

        script.remove();

        setTimeout(
          checkResult,
          3000
        );

        return;
      }


      // =========================
      // REAL ERROR
      // =========================

      status.textContent =
        "❌ AI Error";

      feedback.style.display =
        "block";

      feedback.textContent =
        data && data.error
          ? data.error
          : "Unknown error.";

      script.remove();

    };


    const script =
      document.createElement("script");

    script.src =
      WEB_APP_URL +
      "?action=result" +
      "&requestId=" +
      encodeURIComponent(requestId) +
      "&callback=" +
      callbackName;


    script.onerror = function(){

      delete window[callbackName];

      script.remove();

      if(attempts < maxAttempts){

        setTimeout(
          checkResult,
          3000
        );

      } else {

        status.textContent =
          "⚠️ AI response timeout.";

        feedback.style.display =
          "block";

        feedback.textContent =
          "Gemini did not return a result.";

      }

    };


    document.body.appendChild(script);

  }


  // First check after 5 seconds
  setTimeout(
    checkResult,
    5000
  );

}

function blobToBase64(blob){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onloadend = () => {

      const base64 =
        reader.result.split(",")[1];

      resolve(base64);

    };

    reader.onerror = reject;

    reader.readAsDataURL(blob);

  });

}

</script>

</body>
</html>
